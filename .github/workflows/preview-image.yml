name: Preview Image
on:
  push:
    branches: ['codex/**']
permissions:
  contents: read
  packages: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_client.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/rahb-realtors-association/selenium-screenshots
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=preview-
            type=raw,value=rewrite-staging
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Proxy.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rahb-realtors-association/selenium-screenshots:proxy-staging
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
