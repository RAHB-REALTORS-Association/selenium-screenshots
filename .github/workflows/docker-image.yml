name: Docker Image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/capacity_smoke.py
      - run: node --test tests/test_client.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/rahb-realtors-association/selenium-screenshots
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - name: Build release API image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: screenshot-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify real browser rendering before publishing
        run: |
          mkdir -p test-results
          chmod 777 test-results
          docker run --rm --network none \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            -e PYTHONPATH=/app \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/test-results:/app/test-results" \
            --entrypoint python screenshot-api:ci tests/browser_smoke.py
      - name: Build release proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Proxy.Dockerfile
          platforms: linux/amd64
          load: true
          tags: screenshot-proxy:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Verify proxy destination policy
        run: sh tests/proxy_smoke.sh
      - name: Build gateway and verify the Compose stack
        run: |
          docker build -f deploy/Gateway.Dockerfile -t screenshot-gateway:ci .
          python tests/stack_smoke.py
      - name: Publish the exact tested images
        env:
          RELEASE_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_IMAGE_TAGS" | while IFS= read -r release_image_tag; do
            [ -n "$release_image_tag" ] || continue
            docker tag screenshot-api:ci "$release_image_tag"
            docker push "$release_image_tag"
          done
          for proxy_tag in "proxy-$RELEASE_TAG" proxy-latest; do
            proxy_image="ghcr.io/rahb-realtors-association/selenium-screenshots:$proxy_tag"
            docker tag screenshot-proxy:ci "$proxy_image"
            docker push "$proxy_image"
          done
          for gateway_tag in "gateway-$RELEASE_TAG" gateway-latest; do
            gateway_image="ghcr.io/rahb-realtors-association/selenium-screenshots:$gateway_tag"
            docker tag screenshot-gateway:ci "$gateway_image"
            docker push "$gateway_image"
          done
