http_port 3128
# Only ordinary web ports. IPv6 is deliberately disabled for this staging proxy.
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT
acl blocked dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl blocked dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl blocked dst 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15
acl blocked dst 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/0
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny blocked
http_access allow all
cache deny all
cache_store_log none
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
forwarded_for delete
via off
